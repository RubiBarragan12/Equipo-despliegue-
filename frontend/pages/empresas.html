<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar Estudio</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7f13ec",
                        "background-dark": "#191022",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { min-height: 100dvh; }
    </style>
    <link rel="stylesheet" href="../styles/global.css" />
</head>
<body class="bg-background-dark font-display text-white">
    <div class="relative mx-auto flex min-h-screen w-full max-w-lg flex-col px-4 pb-8">

        <!-- Header -->
        <div class="flex items-center py-5">
            <button id="btn-logout" class="flex items-center justify-center size-10 text-gray-400 hover:text-red-400 transition-colors" title="Cerrar sesión">
                <span class="material-symbols-outlined text-2xl">logout</span>
            </button>
            <div class="flex-1"></div>
        </div>

        <!-- Greeting -->
        <div class="text-center mb-8">
            <div class="mx-auto mb-5 flex h-20 w-20 items-center justify-center rounded-full bg-primary/20">
                <span class="material-symbols-outlined text-primary text-4xl">storefront</span>
            </div>
            <h1 id="greeting" class="text-2xl font-bold mb-2">¡Hola!</h1>
            <p class="text-xl font-bold text-white leading-tight">¿Dónde te vas a tatuar hoy?</p>
            <p class="text-sm text-gray-400 mt-2">Selecciona el estudio para continuar</p>
        </div>

        <!-- Search -->
        <div class="relative mb-6">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">search</span>
            <input id="search-input" type="text"
                class="w-full rounded-xl border border-gray-700 bg-gray-900/50 py-3.5 pl-12 pr-4 text-white placeholder-gray-500 focus:border-primary focus:ring-primary focus:outline-none"
                placeholder="Buscar estudio...">
        </div>

        <!-- Count -->
        <p id="result-count" class="text-sm text-gray-400 mb-4">Cargando...</p>

        <!-- Studios list -->
        <div id="studios-grid" class="flex flex-col gap-4">
            <!-- Cards rendered by JS -->
        </div>

    </div>

    <!-- Toast -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-xl text-sm font-medium shadow-lg -translate-y-16 opacity-0 pointer-events-none transition-all duration-300"></div>

    <script type="module" src="../js/empresas.js"></script>
</body>
</html>
