<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Editar Política - Tattoo Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { "primary": "#D93B3B", "background-dark": "#191022" }, fontFamily: { "display": ["Space Grotesk"] } } }
        }
        
    </script>
</head>

<body class="bg-background-dark font-display text-white/90">
    <div class="relative flex min-h-screen w-full flex-col">
        <header class="flex h-16 items-center px-4 sticky top-0 bg-background-dark/80 backdrop-blur-md z-20 border-b border-white/5">
            <a class="flex items-center justify-center size-10 text-white/90 hover:text-primary transition-colors" href="menu_politicas.html">
                <span class="material-symbols-outlined">close</span>
            </a>
            <div class="flex-1 text-center">
                <h1 class="text-white/90 text-lg font-bold">Editar Política</h1>
            </div>
            <button id="btn-actualizar" class="text-blue-400 font-bold text-sm px-2">Guardar</button>
        </header>

        <main class="p-4 space-y-6">
            <div class="space-y-4">
                <input type="text" id="titulo" placeholder="Título" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-400">
                <textarea id="contenido" rows="12" placeholder="Contenido" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-400 resize-none"></textarea>
            </div>
        </main>
    </div>

    <script>
        const API_URL = 'http://localhost:4000/api/politicas';
        // Obtener ID de los parámetros de la URL (?id=X)
        const urlParams = new URLSearchParams(window.location.search);
        const politicaId = urlParams.get('id');

        // 1. Cargar los datos actuales de la política
        async function cargarDatos() {
            try {
                const response = await fetch(API_URL); // O un endpoint específico si lo tienes
                const result = await response.json();
                // Buscamos la política específica en el array (si tu GET devuelve todas)
                const politica = result.data.find(p => p.idpolitica == politicaId);

                if (politica) {
                    document.getElementById('titulo').value = politica.titulo;
                    document.getElementById('contenido').value = politica.contenido;
                }
            } catch (error) { console.error("Error cargando política:", error); }
        }

        // 2. Guardar los cambios con PUT
        document.getElementById('btn-actualizar').addEventListener('click', async () => {
            const btn = document.getElementById('btn-actualizar');
            const payload = {
                titulo: document.getElementById('titulo').value,
                contenido: document.getElementById('contenido').value
            };

            btn.textContent = "Actualizando...";
            
            try {
                const response = await fetch(`${API_URL}/${politicaId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    window.location.href = 'menu_politicas.html';
                } else {
                    alert("Error al actualizar");
                    btn.textContent = "Guardar";
                }
            } catch (error) { alert("Error de conexión"); }
        });

        document.addEventListener('DOMContentLoaded', cargarDatos);
    </script>
</body>
</html>
