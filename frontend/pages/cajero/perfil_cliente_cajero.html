<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mi Perfil</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#D93B3B",
            "background-light": "#f7f6f8",
            "background-dark": "#191022",
          },
          fontFamily: { "display": ["Space Grotesk", "sans-serif"] },
          borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
        },
      },
    }
</script>
<style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { min-height: max(884px, 100dvh); }
</style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col">
<header class="flex items-center p-4">
    <button id="btn-back" class="flex size-12 shrink-0 items-center justify-start text-slate-900 dark:text-white">
        <span class="material-symbols-outlined text-2xl">arrow_back</span>
    </button>
    <h1 class="flex-1 text-center text-lg font-bold leading-tight tracking-[-0.015em] text-slate-900 dark:text-white">Mi Perfil</h1>
    <div class="size-12 shrink-0"></div>
</header>
<main class="flex flex-1 flex-col p-4">
    <section class="flex w-full flex-col items-center gap-4">
        <div id="avatar-circle" class="min-h-32 w-32 rounded-full bg-[#D93B3B]/20 flex items-center justify-center">
            <span id="avatar-iniciales" class="text-[#D93B3B] font-bold text-4xl leading-none">?</span>
        </div>
        <div class="flex flex-col items-center justify-center">
            <p id="perfil-nombre-display" class="text-slate-900 dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em] text-center">—</p>
            <p id="perfil-rol" class="text-slate-500 dark:text-slate-400 text-base font-normal leading-normal text-center bg-primary/20 px-3 py-1 rounded-full mt-2">—</p>
        </div>
    </section>
    <section class="w-full mt-8">
        <form class="space-y-4" onsubmit="return false">
            <div>
                <label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="nombre">Nombre</label>
                <input class="mt-1 block w-full rounded-xl border-slate-300 bg-white px-4 py-3 text-slate-900 placeholder:text-slate-400 focus:border-primary focus:ring-primary dark:border-slate-600 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500" id="nombre" type="text" placeholder="Tu nombre"/>
            </div>
            <div>
                <label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="email">Correo Electrónico</label>
                <input class="mt-1 block w-full rounded-xl border-slate-300 bg-white px-4 py-3 text-slate-900 placeholder:text-slate-400 focus:border-primary focus:ring-primary dark:border-slate-600 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500" id="email" type="email" placeholder="tu@correo.com" readonly/>
            </div>
            <div>
                <label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="telefono">Teléfono</label>
                <input class="mt-1 block w-full rounded-xl border-slate-300 bg-white px-4 py-3 text-slate-900 placeholder:text-slate-400 focus:border-primary focus:ring-primary dark:border-slate-600 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500" id="telefono" type="tel" placeholder="Número de teléfono"/>
            </div>
        </form>
    </section>
    <div class="flex-grow"></div>
    <section class="w-full pb-4 space-y-3 pt-8">
        <button class="flex h-14 w-full items-center justify-center gap-2 rounded-xl bg-primary px-6 text-base font-bold text-white transition-colors hover:bg-primary/90 active:bg-primary/80">
            Guardar Cambios
        </button>
        <button id="btn-logout" class="flex h-12 w-full items-center justify-center gap-2 rounded-xl bg-red-500/10 px-6 text-base font-medium text-red-500 transition-colors hover:bg-red-500/20 active:bg-red-500/25">
            <span class="material-symbols-outlined">logout</span>
            Cerrar Sesión
        </button>
    </section>
</main>
</div>
<script>
    function getIniciales(nombre = '') {
        const p = nombre.trim().split(/\s+/).filter(Boolean);
        if (p.length >= 2) return (p[0][0] + p[1][0]).toUpperCase();
        return (p[0] || '?').substring(0, 2).toUpperCase();
    }

    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (!user) { window.location.href = '/'; }
    else {
        document.getElementById('nombre').value = user.nombre || '';
        document.getElementById('email').value = user.correo || '';
        document.getElementById('telefono').value = user.telefono || '';
        document.getElementById('perfil-nombre-display').textContent = user.nombre || '—';
        document.getElementById('perfil-rol').textContent = user.rol || '—';
        document.getElementById('avatar-iniciales').textContent = getIniciales(user.nombre);
    }

    document.getElementById('btn-back').addEventListener('click', () => window.history.back());
    document.getElementById('btn-logout').addEventListener('click', () => {
        localStorage.removeItem('user');
        localStorage.removeItem('empresa');
        window.location.href = '/';
    });
</script>
</body>
</html>
