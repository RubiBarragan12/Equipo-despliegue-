<!DOCTYPE html>
<html class="dark" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Bloquear Horas</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ffc107",
                        "secondary-accent": "#8b5cf6",
                        "background-dark": "#1a1a1a",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24
        }

        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }

        body {
            min-height: 100dvh;
        }

        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.7);
        }
    </style>
</head>

<body class="bg-background-dark font-display text-white">
    <div class="relative flex min-h-screen w-full flex-col pb-24">

        <!-- Header -->
        <div class="flex items-center p-4 sticky top-0 bg-background-dark z-10">
            <a href="editar_disponibilidad.html" class="flex items-center justify-center size-10 text-white">
                <span class="material-symbols-outlined text-2xl">arrow_back</span>
            </a>
            <h2 class="text-lg font-bold flex-1 text-center">Bloquear Horas</h2>
            <div class="size-10"></div>
        </div>

        <!-- Title -->
        <div class="px-4 pb-6">
            <h1 class="text-[22px] font-bold">Bloquear Horas Ocupadas</h1>
            <p class="text-zinc-400 text-sm mt-1">Marca periodos de tiempo como no disponibles en tu agenda.</p>
        </div>

        <!-- Form -->
        <form id="form-bloqueo" class="px-4 space-y-5">

            <!-- FECHA -->
            <div class="rounded-xl border border-zinc-700/50 bg-zinc-900/40 p-4">
                <label class="text-[11px] font-bold uppercase tracking-widest text-zinc-400 mb-2 block">Fecha</label>
                <input type="date" id="bloqueo-fecha"
                    class="w-full rounded-lg border border-zinc-700 bg-zinc-800 px-4 py-3 text-white text-base focus:border-secondary-accent focus:ring-secondary-accent [color-scheme:dark]"
                    required />
            </div>

            <!-- REPETIR CADA -->
            <div class="rounded-xl border border-zinc-700/50 bg-zinc-900/40 p-4">
                <label class="text-[11px] font-bold uppercase tracking-widest text-zinc-400 mb-2 block">Repetir
                    Cada</label>
                <div class="relative">
                    <select id="bloqueo-repetir"
                        class="w-full rounded-lg border border-zinc-700 bg-zinc-800 px-4 py-3 pr-10 text-white text-base focus:border-secondary-accent focus:ring-secondary-accent">
                        <option value="unica">Única Vez</option>
                        <option value="diario">Todos los Días</option>
                        <option value="lunes">Cada Lunes</option>
                        <option value="martes">Cada Martes</option>
                        <option value="miercoles">Cada Miércoles</option>
                        <option value="jueves">Cada Jueves</option>
                        <option value="viernes">Cada Viernes</option>
                        <option value="sabado">Cada Sábado</option>
                        <option value="domingo">Cada Domingo</option>
                    </select>
                    <span
                        class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 text-xl pointer-events-none">expand_more</span>
                </div>
            </div>

            <!-- HORA INICIO / HORA FIN -->
            <div class="rounded-xl border border-zinc-700/50 bg-zinc-900/40 p-4">
                <div class="grid grid-cols-[1fr_auto_1fr] items-end gap-3">
                    <div>
                        <label class="text-[11px] font-bold uppercase tracking-widest text-zinc-400 mb-2 block">Hora
                            Inicio</label>
                        <div class="relative">
                            <select id="bloqueo-inicio"
                                class="w-full rounded-lg border border-zinc-700 bg-zinc-800 px-3 py-3 pr-8 text-white text-base focus:border-secondary-accent focus:ring-secondary-accent">
                            </select>
                            <span
                                class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-zinc-400 text-base pointer-events-none">expand_more</span>
                        </div>
                    </div>
                    <span
                        class="material-symbols-outlined text-zinc-500 text-2xl pb-3">arrow_forward</span>
                    <div>
                        <label class="text-[11px] font-bold uppercase tracking-widest text-zinc-400 mb-2 block">Hora
                            Fin</label>
                        <div class="relative">
                            <select id="bloqueo-fin"
                                class="w-full rounded-lg border border-zinc-700 bg-zinc-800 px-3 py-3 pr-8 text-white text-base focus:border-secondary-accent focus:ring-secondary-accent">
                            </select>
                            <span
                                class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-zinc-400 text-base pointer-events-none">expand_more</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- MOTIVO -->
            <div class="rounded-xl border border-zinc-700/50 bg-zinc-900/40 p-4">
                <label class="text-[11px] font-bold uppercase tracking-widest text-zinc-400 mb-2 block">Motivo
                    (Opcional)</label>
                <textarea id="bloqueo-motivo" rows="2"
                    class="w-full rounded-lg border border-zinc-700 bg-zinc-800 px-4 py-3 text-white text-base placeholder-zinc-600 focus:border-secondary-accent focus:ring-secondary-accent resize-none"
                    placeholder="Ej: Descanso médico, almuerzo..."></textarea>
            </div>

            <!-- Submit -->
            <button type="submit" id="btn-bloquear"
                class="w-full flex items-center justify-center gap-2 rounded-xl bg-secondary-accent py-4 text-white font-bold text-base hover:bg-secondary-accent/90 transition-colors mt-2">
                <span class="material-symbols-outlined text-xl">block</span>
                Bloquear Horario
            </button>

            <p class="text-zinc-500 text-xs text-center pb-4">
                Las horas bloqueadas no aparecerán disponibles para citas de clientes.
            </p>
        </form>

        <!-- Toast notification -->
        <div id="toast"
            class="fixed top-5 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-xl text-sm font-medium shadow-lg transition-all duration-300 -translate-y-16 opacity-0 pointer-events-none">
        </div>

        <!-- Bottom Nav -->
        <div
            class="fixed bottom-0 left-0 right-0 z-20 flex justify-around border-t border-zinc-800 bg-zinc-900 py-2 px-2">
            <a class="flex flex-1 cursor-pointer flex-col items-center justify-center gap-1 p-2 text-primary"
                href="../../tatuador/menu_tatuador.html">
                <span class="material-symbols-outlined fill">home</span>
                <span class="text-[11px] font-medium">Inicio</span>
            </a>
            <a class="flex flex-1 cursor-pointer flex-col items-center justify-center gap-1 p-2 text-zinc-400"
                href="/pages/tatuador/horarios/editar_disponibilidad.html">
                <span class="material-symbols-outlined">calendar_month</span>
                <span class="text-[11px] font-medium">Agenda</span>
            </a>
            <a class="flex flex-1 cursor-pointer flex-col items-center justify-center gap-1 p-2 text-zinc-400"
                href="/pages/cliente/seguimiento/index.html">
                <span class="material-symbols-outlined">chat_bubble</span>
                <span class="text-[11px] font-medium">Seguimiento</span>
            </a>
        </div>
    </div>

    <script type="module" src="../../../js/bloquear_horas.js"></script>
</body>

</html>
