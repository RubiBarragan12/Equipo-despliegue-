<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Revisar Cotización</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ffc107",
                        "secondary-accent": "#8b5cf6",
                        "background-dark": "#1a1a1a",
                    },
                    fontFamily: { "display": ["Space Grotesk", "sans-serif"] },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1; }
        body { min-height: max(884px, 100dvh); }
    </style>
</head>
<body class="bg-background-dark font-display text-white">
    <div class="relative flex h-auto min-h-screen w-full flex-col max-w-lg mx-auto overflow-x-hidden pb-8">

        <!-- Header -->
        <div class="flex items-center p-4 pb-2 justify-between sticky top-0 bg-background-dark z-10">
            <button id="btn-back" class="flex size-12 shrink-0 items-center justify-start text-white">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <h1 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">
                Revisar Cotización
            </h1>
        </div>

        <!-- Info del cliente -->
        <div id="cliente-info" class="mx-4 mt-4 p-4 rounded-xl bg-zinc-800/60 border border-zinc-700/50">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-secondary-accent/20 flex items-center justify-center">
                    <span class="material-symbols-outlined text-secondary-accent">person</span>
                </div>
                <div>
                    <p id="cliente-nombre" class="text-white font-bold text-sm">Cliente</p>
                    <p id="cliente-fecha" class="text-zinc-400 text-xs"></p>
                </div>
            </div>
        </div>

        <!-- Imagen de referencia -->
        <div class="mx-4 mt-4">
            <p class="text-zinc-400 text-xs font-bold uppercase tracking-wider mb-2">Imagen de referencia</p>
            <div class="aspect-[4/3] w-full overflow-hidden rounded-xl bg-zinc-800/60 border border-zinc-700/50">
                <img id="referencia-img" alt="Referencia" class="w-full h-full object-cover hidden" />
                <div id="referencia-placeholder" class="w-full h-full flex flex-col items-center justify-center text-zinc-600">
                    <span class="material-symbols-outlined text-4xl">image</span>
                    <p class="text-sm mt-2">Sin imagen de referencia</p>
                </div>
            </div>
        </div>

        <!-- Specs Grid -->
        <div class="grid grid-cols-3 gap-3 mx-4 mt-4">
            <div class="bg-zinc-800/60 border border-zinc-700/50 p-3 rounded-xl text-center">
                <span class="material-symbols-outlined text-primary text-xl fill">straighten</span>
                <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-wider mt-1">Tamaño</p>
                <p id="tamano" class="text-white text-sm font-bold mt-0.5">N/A</p>
            </div>
            <div class="bg-zinc-800/60 border border-zinc-700/50 p-3 rounded-xl text-center">
                <span class="material-symbols-outlined text-primary text-xl fill">accessibility_new</span>
                <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-wider mt-1">Ubicación</p>
                <p id="ubicacion" class="text-white text-sm font-bold mt-0.5">N/A</p>
            </div>
            <div class="bg-zinc-800/60 border border-zinc-700/50 p-3 rounded-xl text-center">
                <span class="material-symbols-outlined text-primary text-xl fill">palette</span>
                <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-wider mt-1">Técnica</p>
                <p id="estilo" class="text-white text-sm font-bold mt-0.5">N/A</p>
            </div>
        </div>

        <!-- Descripción -->
        <div class="mx-4 mt-4">
            <p class="text-zinc-400 text-xs font-bold uppercase tracking-wider mb-2">Descripción del cliente</p>
            <div class="bg-zinc-800/60 border border-zinc-700/50 p-4 rounded-xl">
                <p id="descripcion" class="text-zinc-300 text-sm leading-relaxed">Sin descripción disponible.</p>
            </div>
        </div>

        <!-- Pricing Section -->
        <div class="mx-4 mt-6 bg-zinc-800/60 border border-zinc-700/50 rounded-xl p-5">
            <p class="text-zinc-400 text-xs font-bold uppercase tracking-wider mb-4">Cotización</p>

            <!-- Estimado -->
            <div class="flex items-center justify-between mb-4 pb-4 border-b border-zinc-700/50">
                <span class="text-zinc-400 text-sm">Estimado por sistema</span>
                <span id="monto-estimado" class="text-white text-lg font-bold">$0</span>
            </div>

            <!-- Input precio final -->
            <div class="mb-4">
                <label class="block text-xs font-bold text-primary uppercase tracking-wider mb-2" for="quote-price">
                    Tu precio final
                </label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400 font-bold">$</span>
                    <input id="quote-price" type="number" step="10" value="0"
                        class="w-full bg-zinc-900/80 border border-zinc-600 rounded-xl pl-8 pr-4 py-3.5 text-xl font-bold text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/30 transition-colors" />
                </div>
            </div>

            <!-- Justificación -->
            <div>
                <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2" for="justification">
                    Justificación de ajustes <span class="text-zinc-600">(opcional)</span>
                </label>
                <textarea id="justification" rows="3" placeholder="Ej: Requiere más detalle, colores extra, sesión más larga..."
                    class="w-full bg-zinc-900/80 border border-zinc-600 rounded-xl p-4 text-sm text-zinc-300 placeholder:text-zinc-600 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/30 resize-none transition-colors"></textarea>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="mx-4 mt-6 flex flex-col gap-3">
            <button id="btn-aceptar"
                class="w-full py-4 rounded-xl bg-primary text-black font-bold text-base tracking-wide shadow-lg shadow-primary/20 hover:bg-yellow-400 active:scale-[0.98] transition-all">
                Enviar Cotización al Cliente
            </button>
            <button id="btn-rechazar"
                class="w-full py-3.5 rounded-xl bg-zinc-800/60 border border-zinc-700/50 text-red-400 font-bold text-sm hover:bg-red-500/10 hover:border-red-500/30 active:scale-[0.98] transition-all">
                Rechazar Solicitud
            </button>
        </div>
    </div>

    <script src="/js/cotizaciones_tatuador.js"></script>
</body>
</html>
