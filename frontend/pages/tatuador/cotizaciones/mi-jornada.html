<main class="pt-24 px-6 space-y-8">
    <!-- Welcome Header -->

    <!-- Quick Actions & Cotizaciones -->

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/api-config.js"></script>
<script src="/js/cotizaciones.js"></script>

<script>
// ============================================
// VARIABLES GLOBALES
// ============================================
let todasLasCotizaciones = [];
let filtroActual = 'todas';

// ============================================
// FUNCIÓN PARA OBTENER COLOR SEGÚN ESTADO
// ============================================
function getEstadoColor(estado) {
    switch(estado) {
        case 'pendiente':
            return 'bg-primary/10 text-primary-fixed';
        case 'aprobada':
            return 'bg-tertiary-container/10 text-tertiary-fixed';
        case 'rechazada':
            return 'bg-error-container/20 text-error-dim';
        default:
            return 'bg-surface-container-high text-on-surface-variant';
    }
}

// ============================================
// FUNCIÓN PARA RENDERIZAR COTIZACIONES
// ============================================
function renderizarCotizaciones(cotizaciones) {
    const contenedor = document.getElementById('cotizaciones-lista');
    
    if (!contenedor) return;
    
    if (cotizaciones.length === 0) {
        contenedor.innerHTML = `
            <div class="text-center py-8 text-on-surface-variant/50">
                <span class="material-symbols-outlined text-4xl mb-2">receipt</span>
                <p>No hay cotizaciones</p>
            </div>
        `;
        return;
    }
    
    const cotizacionesHTML = cotizaciones.map(cotizacion => {
        const fecha = cotizacion.fecha_cotizacion 
            ? new Date(cotizacion.fecha_cotizacion).toLocaleDateString('es-MX') 
            : 'Fecha no disponible';
        
        const estadoColor = getEstadoColor(cotizacion.estado_nombre);
        const estadoTexto = cotizacion.estado_nombre === 'pendiente' ? 'Pendiente' :
                           (cotizacion.estado_nombre === 'aprobada' ? 'Aprobada' : 'Rechazada');
        
        const precioMostrar = cotizacion.preciofinal ? cotizacion.preciofinal : cotizacion.montoestimado;
        const precioLabel = cotizacion.preciofinal ? 'Precio final' : 'Monto estimado';
        
        return `
            <div class="bg-surface-container rounded-2xl p-4 flex items-center justify-between transition-all hover:scale-[1.02] cursor-pointer" 
                 onclick="verCotizacion(${cotizacion.idcotizacion})">
                <div class="flex items-center gap-4 flex-1">
                    <div class="w-12 h-12 rounded-xl bg-surface-container-highest flex items-center justify-center">
                        <span class="material-symbols-outlined text-primary">receipt_long</span>
                    </div>
                    <div>
                        <h5 class="font-bold text-on-surface text-sm">Cotización #${cotizacion.idcotizacion}</h5>
                        <p class="text-xs text-on-surface-variant">${precioLabel}: $${precioMostrar || '0'}</p>
                        <p class="text-[10px] text-primary mt-1">${fecha}</p>
                        ${cotizacion.justificacion_ajuste ? `<p class="text-[10px] text-on-surface-variant/50 mt-1">✏️ ${cotizacion.justificacion_ajuste.substring(0, 40)}${cotizacion.justificacion_ajuste.length > 40 ? '...' : ''}</p>` : ''}
                    </div>
                </div>
                <span class="${estadoColor} px-3 py-1 rounded-lg text-[10px] font-bold uppercase tracking-tighter">${estadoTexto}</span>
            </div>
        `;
    }).join('');
    
    contenedor.innerHTML = cotizacionesHTML;
}

// ============================================
// FUNCIÓN PARA CARGAR COTIZACIONES (TODAS)
// ============================================
async function cargarCotizaciones() {
    console.log('🔄 Cargando TODAS las cotizaciones...');
    
    const resultado = await cotizacionesAPI.obtenerTodasCotizaciones();
    
    if (!resultado.success) {
        console.error('Error:', resultado.error);
        const contenedor = document.getElementById('cotizaciones-lista');
        if (contenedor) {
            contenedor.innerHTML = `
                <div class="text-center py-8 text-error-dim">
                    ❌ Error: ${resultado.error}
                </div>
            `;
        }
        return;
    }
    
    todasLasCotizaciones = resultado.data;
    console.log(`✅ ${todasLasCotizaciones.length} cotizaciones cargadas`);
    
    aplicarFiltro();
}

// ============================================
// FUNCIÓN PARA APLICAR FILTRO
// ============================================
function aplicarFiltro() {
    let cotizacionesFiltradas = [];
    
    if (filtroActual === 'todas') {
        cotizacionesFiltradas = todasLasCotizaciones;
    } else {
        cotizacionesFiltradas = todasLasCotizaciones.filter(
            c => c.estado_nombre === filtroActual
        );
    }
    
    renderizarCotizaciones(cotizacionesFiltradas);
    
    const pendientesCount = todasLasCotizaciones.filter(c => c.estado_nombre === 'pendiente').length;
    const headerSpan = document.getElementById('cotizaciones-header');
    if (headerSpan) headerSpan.textContent = `${pendientesCount} cotizaciones pendientes`;
}

// ============================================
// FUNCIÓN PARA VER COTIZACIÓN
// ============================================
function verCotizacion(idcotizacion) {
    console.log(`🔍 Abriendo cotización ${idcotizacion}`);
    window.location.href = `cotizacion.html?id=${idcotizacion}`;
}

// ============================================
// CONFIGURAR NAVEGACIÓN ENTRE TABS
// ============================================
function configurarTabs() {
    const tabs = document.querySelectorAll('.tab-btn');
    
    console.log(`📑 Encontrados ${tabs.length} tabs`);
    
    tabs.forEach(tab => {
        tab.addEventListener('click', function() {
            const tabText = this.textContent.trim().toLowerCase();
            console.log(`🔘 Tab clickeado: ${tabText}`);
            
            // Quitar estilos activos de todos los tabs
            tabs.forEach(t => {
                t.classList.remove('bg-primary-container/20', 'text-primary-fixed', 'border-primary/30');
                t.classList.add('bg-surface-container-high', 'text-on-surface-variant');
            });
            
            // Activar tab actual
            this.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
            this.classList.add('bg-primary-container/20', 'text-primary-fixed', 'border', 'border-primary/30');
            
            // Actualizar filtro según tab
            if (tabText.includes('todas')) {
                filtroActual = 'todas';
            } else if (tabText.includes('pendiente')) {
                filtroActual = 'pendiente';
            } else if (tabText.includes('aprobada')) {
                filtroActual = 'aprobada';
            } else if (tabText.includes('rechazada')) {
                filtroActual = 'rechazada';
            }
            
            aplicarFiltro();
        });
    });
}

// ============================================
// ACTUALIZAR CONTADORES DE TABS
// ============================================
async function actualizarContadoresTabs() {
    const pendientes = await cotizacionesAPI.contarPorEstado('pendiente');
    const aprobadas = await cotizacionesAPI.contarPorEstado('aprobada');
    const rechazadas = await cotizacionesAPI.contarPorEstado('rechazada');
    
    const badgeTodas = document.getElementById('cotizaciones-count');
    if (badgeTodas) badgeTodas.textContent = todasLasCotizaciones.length;
    
    const tabs = document.querySelectorAll('.tab-btn');
    
    tabs.forEach(tab => {
        const text = tab.textContent.trim().toLowerCase();
        let count = 0;
        
        if (text.includes('todas')) {
            count = todasLasCotizaciones.length;
        } else if (text.includes('pendiente')) {
            count = pendientes.count;
        } else if (text.includes('aprobada')) {
            count = aprobadas.count;
        } else if (text.includes('rechazada')) {
            count = rechazadas.count;
        }
        
        // Remover badge existente
        const existingBadge = tab.querySelector('.badge-count');
        if (existingBadge) existingBadge.remove();
        
        // Agregar badge si hay count y no es el tab "Todas"
        if (count > 0 && !text.includes('todas')) {
            const badge = document.createElement('span');
            badge.className = 'badge-count ml-1 bg-primary/30 px-1.5 py-0.5 rounded-full text-[10px]';
            badge.textContent = count;
            tab.appendChild(badge);
        }
    });
}

// ============================================
// CARGA INICIAL
// ============================================
document.addEventListener('DOMContentLoaded', async function() {
    console.log('🚀 Página cargada - Iniciando...');
    
    configurarTabs();
    
    if (typeof cotizacionesAPI === 'undefined') {
        console.error('❌ cotizacionesAPI no está definido');
        const contenedor = document.getElementById('cotizaciones-lista');
        if (contenedor) {
            contenedor.innerHTML = `
                <div class="text-center py-8 text-error-dim">
                    ❌ Error: No se pudo cargar el módulo de cotizaciones
                </div>
            `;
        }
        return;
    }
    
    await cotizacionesAPI.cargarEstados();
    await cargarCotizaciones();
    await actualizarContadoresTabs();
});
</script>

</body>
