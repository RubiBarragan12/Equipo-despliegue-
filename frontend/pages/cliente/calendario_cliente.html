<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Mi Calendario</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: {
                colors: { "primary": "#7f13ec", "background-dark": "#191022", "background-light": "#f7f6f8" },
                fontFamily: { "display": ["Space Grotesk", "sans-serif"] }
            }}
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        body { min-height: max(884px, 100dvh); }
        .dia-cita::after { content:''; display:block; width:5px; height:5px; border-radius:50%; background:#7f13ec; margin:1px auto 0; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display pb-28">

<header class="sticky top-0 z-10 flex h-16 items-center justify-between bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm px-4 border-b border-white/10">
    <a href="/pages/cliente/menu_cliente.html" class="flex size-12 items-center justify-start text-gray-700 dark:text-white">
        <span class="material-symbols-outlined">arrow_back</span>
    </a>
    <h1 class="text-lg font-bold text-gray-900 dark:text-white flex-1 text-center">Mi Calendario</h1>
    <div class="size-12"></div>
</header>

<main class="px-4 pt-4">
    <div class="flex items-center justify-between mb-4">
        <button id="btn-prev" class="flex size-10 items-center justify-center rounded-full hover:bg-primary/10 text-gray-600 dark:text-white transition-colors">
            <span class="material-symbols-outlined">chevron_left</span>
        </button>
        <h2 id="mes-titulo" class="text-base font-bold text-gray-900 dark:text-white"></h2>
        <button id="btn-next" class="flex size-10 items-center justify-center rounded-full hover:bg-primary/10 text-gray-600 dark:text-white transition-colors">
            <span class="material-symbols-outlined">chevron_right</span>
        </button>
    </div>

    <div class="grid grid-cols-7 mb-1">
        <div class="text-center text-xs font-bold text-gray-400 py-1">Lu</div>
        <div class="text-center text-xs font-bold text-gray-400 py-1">Ma</div>
        <div class="text-center text-xs font-bold text-gray-400 py-1">Mi</div>
        <div class="text-center text-xs font-bold text-gray-400 py-1">Ju</div>
        <div class="text-center text-xs font-bold text-gray-400 py-1">Vi</div>
        <div class="text-center text-xs font-bold text-gray-400 py-1">Sá</div>
        <div class="text-center text-xs font-bold text-gray-400 py-1">Do</div>
    </div>

    <div id="cal-grid" class="grid grid-cols-7 gap-1 mb-6"></div>

    <div id="cita-detalle" class="space-y-3"></div>
</main>

<nav class="fixed bottom-0 z-10 w-full border-t border-gray-200 bg-background-light/90 backdrop-blur-sm dark:border-gray-700 dark:bg-background-dark/90">
    <div class="grid h-16 grid-cols-4 items-center justify-items-center px-2">
        <a class="flex flex-col items-center justify-center gap-1 text-gray-500 dark:text-gray-400" href="/pages/cliente/menu_cliente.html">
            <span class="material-symbols-outlined">home</span>
            <span class="text-xs font-medium">Inicio</span>
        </a>
        <a class="flex flex-col items-center justify-center gap-1 text-primary" href="/pages/cliente/calendario_cliente.html">
            <span class="material-symbols-outlined">calendar_month</span>
            <span class="text-xs font-bold">Mis Citas</span>
        </a>
        <a class="flex flex-col items-center justify-center gap-1 text-gray-500 dark:text-gray-400" href="/pages/cliente/seguimiento/index.html">
            <span class="material-symbols-outlined">chat</span>
            <span class="text-xs font-medium">Seguimiento</span>
        </a>
        <a class="flex flex-col items-center justify-center gap-1 text-gray-500 dark:text-gray-400" href="/pages/cliente/cotizacion/mis_cotizaciones.html">
            <span class="material-symbols-outlined">person</span>
            <span class="text-xs font-medium">Mi Cuenta</span>
        </a>
    </div>
</nav>

<script>
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (!user || user.rol !== 'cliente') { window.location.href = '/'; }

    const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    let vistaFecha = new Date();
    let cotizaciones = [];
    let diaSeleccionado = null;

    function pad2(n) { return String(n).padStart(2, '0'); }
    function toISO(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
    function escapeHtml(s) { if (!s) return ''; return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    async function cargarCotizaciones() {
        try {
            const r = await fetch(`/api/cotizaciones/cliente/${user.idcliente}`);
            const j = await r.json();
            // Mostrar solo citas confirmadas (anticipo pagado o totalmente pagadas)
            cotizaciones = (j.data || []).filter(c => {
                const e = (c.estado || '').toLowerCase();
                return e === 'pagada' || e === 'pagado anticipo';
            });
            renderCalendario();
            seleccionarDia(toISO(new Date()));
        } catch (_) {}
    }

    function renderCalendario() {
        const year = vistaFecha.getFullYear();
        const month = vistaFecha.getMonth();
        document.getElementById('mes-titulo').textContent = `${MESES[month]} ${year}`;

        const diasConCita = new Set(cotizaciones.map(c => {
            if (!c.fecha) return null;
            // Normalizar fecha (puede venir como "2026-05-10T00:00:00.000Z" o "2026-05-10")
            return c.fecha.substring(0, 10);
        }).filter(Boolean));

        const hoyISO = toISO(new Date());
        let startDow = new Date(year, month, 1).getDay();
        startDow = startDow === 0 ? 6 : startDow - 1;
        const diasEnMes = new Date(year, month + 1, 0).getDate();

        const grid = document.getElementById('cal-grid');
        grid.innerHTML = '';

        for (let i = 0; i < startDow; i++) grid.innerHTML += `<div></div>`;

        for (let d = 1; d <= diasEnMes; d++) {
            const isoDate = `${year}-${pad2(month+1)}-${pad2(d)}`;
            const tieneCita = diasConCita.has(isoDate);
            const esHoy = isoDate === hoyISO;
            const sel = isoDate === diaSeleccionado;

            grid.innerHTML += `
                <button onclick="seleccionarDia('${isoDate}')"
                    class="flex flex-col items-center justify-center h-10 w-full rounded-full text-sm font-medium transition-colors
                        ${sel ? 'bg-primary text-white' : esHoy ? 'border border-primary text-primary' : 'text-gray-700 dark:text-gray-200 hover:bg-primary/10'}
                        ${tieneCita && !sel ? 'dia-cita' : ''}">
                    <span>${d}</span>
                    ${tieneCita && sel ? '<span class="w-1.5 h-1.5 rounded-full bg-white mt-0.5"></span>' : ''}
                </button>`;
        }
    }

    function seleccionarDia(isoDate) {
        diaSeleccionado = isoDate;
        renderCalendario();

        const el = document.getElementById('cita-detalle');
        const cotsDia = cotizaciones.filter(c => c.fecha && c.fecha.substring(0, 10) === isoDate);
        const [y, m, d] = isoDate.split('-').map(Number);
        const fechaFmt = `${d} de ${MESES[m-1]}`;

        if (cotsDia.length === 0) {
            el.innerHTML = `
                <div class="flex flex-col items-center justify-center py-8 text-gray-400">
                    <span class="material-symbols-outlined text-4xl mb-2 opacity-50">event_busy</span>
                    <p class="text-sm">Sin citas el ${fechaFmt}</p>
                </div>`;
            return;
        }

        el.innerHTML = `<p class="text-sm font-bold text-gray-500 dark:text-gray-400 mb-3">Tu cita del ${fechaFmt}</p>` +
            cotsDia.map(cot => {
                const precio = parseFloat(cot.preciofinal || cot.montoestimado || 0);
                const e = (cot.estado || '').toLowerCase();
                const pagadoTotal = e === 'pagada';
                return `
                <div class="rounded-xl bg-white dark:bg-[#261933] border border-gray-200 dark:border-[#362348] p-4 space-y-3">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center">
                                <span class="material-symbols-outlined text-primary">brush</span>
                            </div>
                            <div>
                                <p class="font-bold text-gray-900 dark:text-white">${escapeHtml(cot.tatuador_nombre || 'Tatuador')}</p>
                                <p class="text-xs text-gray-500 dark:text-gray-400">${escapeHtml(cot.estilo || 'Tatuaje')}</p>
                            </div>
                        </div>
                        <span class="text-xs px-2 py-1 rounded-full ${pagadoTotal ? 'bg-green-500/20 text-green-400' : 'bg-orange-500/20 text-orange-400'}">
                            ${pagadoTotal ? 'Pagado' : 'Anticipo pagado'}
                        </span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-sm text-gray-500 dark:text-gray-400">
                        <div class="flex items-center gap-1">
                            <span class="material-symbols-outlined text-base">schedule</span>
                            <span>${cot.hora ? cot.hora.substring(0,5) : '—'} hrs</span>
                        </div>
                        ${cot.zonacuerpo ? `<div class="flex items-center gap-1"><span class="material-symbols-outlined text-base">body_system</span><span>${escapeHtml(cot.zonacuerpo)}</span></div>` : ''}
                    </div>
                    <div class="pt-2 border-t border-gray-100 dark:border-white/10 flex justify-between">
                        <span class="text-sm text-gray-500 dark:text-gray-400">Precio total</span>
                        <span class="font-bold text-gray-900 dark:text-white">$${precio.toFixed(2)}</span>
                    </div>
                </div>`;
            }).join('');
    }

    document.getElementById('btn-prev').addEventListener('click', () => {
        vistaFecha.setMonth(vistaFecha.getMonth() - 1);
        diaSeleccionado = null;
        document.getElementById('cita-detalle').innerHTML = '';
        renderCalendario();
    });
    document.getElementById('btn-next').addEventListener('click', () => {
        vistaFecha.setMonth(vistaFecha.getMonth() + 1);
        diaSeleccionado = null;
        document.getElementById('cita-detalle').innerHTML = '';
        renderCalendario();
    });

    cargarCotizaciones();
</script>
</body>
</html>
