<!DOCTYPE html>
<html class="dark" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Tattoo Studio - Inicio</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7f13ec",
                        "background-light": "#f7f6f8",
                        "background-dark": "#191022",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                    },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
    <link rel="stylesheet" href="../styles/global.css" />
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
    <div class="relative mx-auto flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
        <header
            class="sticky top-0 z-10 flex h-16 shrink-0 items-center justify-between bg-background-light/80 px-4 py-2 backdrop-blur-sm dark:bg-background-dark/80">
            <div class="flex items-center gap-3">
                <div class="size-10 shrink-0">
                    <div id="user-avatar" class="aspect-square size-full rounded-full bg-primary/20 flex items-center justify-center">
                        <span id="user-initials" class="text-primary font-bold text-sm leading-none">?</span>
                    </div>
                </div>
                <div class="flex flex-col">
                    <h1 id="user-greeting" class="font-display text-lg font-bold text-gray-900 dark:text-white">Hola</h1>
                    <p id="empresa-name" class="text-xs text-gray-500 dark:text-gray-400"></p>
                </div>
            </div>
            <div class="flex items-center justify-end gap-2">
                <button id="notif-btn"
                    class="flex h-12 w-12 cursor-pointer items-center justify-center overflow-hidden rounded-full bg-transparent text-gray-600 dark:text-gray-300">
                    <span class="material-symbols-outlined text-2xl">notifications</span>
                </button>
                <button id="logout-btn"
                    class="flex h-12 w-12 cursor-pointer items-center justify-center overflow-hidden rounded-full bg-transparent text-gray-600 hover:text-red-500 dark:text-gray-300 dark:hover:text-red-400 transition-colors"
                    title="Cerrar sesión">
                    <span class="material-symbols-outlined text-2xl">logout</span>
                </button>
            </div>
        </header>
        <main class="flex-1 pb-24">
            <!-- Próxima cita card - se llena dinámicamente -->
            <div id="proxima-cita-container" class="p-4 hidden"></div>
            <div class="flex px-4 py-2">
                <a href="agendar_cita/cita_datos.html"
                    class="flex h-12 min-w-[84px] flex-1 cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-xl bg-primary px-5 font-display text-base font-bold tracking-wide text-white shadow-lg shadow-primary/40 no-underline">
                    <span class="material-symbols-outlined">add</span>
                    <span class="truncate">Agendar Nueva Cita</span>
                </a>
            </div>
            <div class="grid grid-cols-[repeat(auto-fit,minmax(150px,1fr))] gap-3 p-4">
                <a href="cotizacion/mis_cotizaciones.html"
                    class="flex flex-1 cursor-pointer items-center gap-3 rounded-xl border border-gray-200 bg-white p-4 transition-all hover:border-primary/50 dark:border-[#4d3267]/50 dark:bg-[#261933] dark:hover:border-primary no-underline">
                    <span class="material-symbols-outlined text-primary">sell</span>
                    <h2 class="font-display text-base font-bold text-gray-800 dark:text-white">Mis Cotizaciones</h2>
                </a>
                <a href="/pages/cliente/historial_cliente.html"
                    class="flex flex-1 cursor-pointer items-center gap-3 rounded-xl border border-gray-200 bg-white p-4 transition-all hover:border-primary/50 dark:border-[#4d3267]/50 dark:bg-[#261933] dark:hover:border-primary no-underline">
                    <span class="material-symbols-outlined text-primary">photo_library</span>
                    <h2 class="font-display text-base font-bold text-gray-800 dark:text-white">Mi Historial</h2>
                </a>
            </div>
            <div class="px-4 pb-2 pt-4">
                <h3 class="font-display text-lg font-bold leading-tight tracking-tight text-gray-900 dark:text-white">
                    Actividad Reciente</h3>
            </div>
            <div id="actividad-container" class="flex flex-col gap-2 px-4 pb-4">
                <div class="flex items-center justify-center py-4 text-gray-400">
                    <div class="inline-block animate-spin rounded-full h-4 w-4 border-2 border-primary border-t-transparent mr-2"></div>
                    <span class="text-sm">Cargando...</span>
                </div>
            </div>
            <div class="px-4 pb-2 pt-6 flex items-center justify-between">
                <h3 class="font-display text-lg font-bold leading-tight tracking-tight text-gray-900 dark:text-white">
                    Mis Tatuajes</h3>
                <a href="/pages/cliente/historial_cliente.html" class="text-sm font-medium text-primary">Ver todos</a>
            </div>
            <div id="tatuajes-container" class="pb-2">
                <div class="flex items-center justify-center py-4 text-gray-400">
                    <div class="inline-block animate-spin rounded-full h-4 w-4 border-2 border-primary border-t-transparent mr-2"></div>
                    <span class="text-sm">Cargando...</span>
                </div>
            </div>

        </main>
        <nav
            class="fixed bottom-0 z-10 mx-auto w-full  border-t border-gray-200 bg-background-light/90 backdrop-blur-sm dark:border-gray-700 dark:bg-background-dark/90">
            <div class="grid h-16 grid-cols-4 items-center justify-items-center px-2">
                <a class="flex flex-col items-center justify-center gap-1 text-primary" href="/pages/cliente/menu_cliente.html">
                    <span class="material-symbols-outlined">home</span>
                    <span class="text-xs font-bold">Inicio</span>
                </a>
                <a class="flex flex-col items-center justify-center gap-1 text-gray-500 dark:text-gray-400" href="/pages/cliente/calendario_cliente.html">
                    <span class="material-symbols-outlined">calendar_month</span>
                    <span class="text-xs font-medium">Mis Citas</span>
                </a>
                <a class="flex flex-col items-center justify-center gap-1 text-gray-500 dark:text-gray-400" href="/pages/cliente/seguimiento/index.html">
                    <span class="material-symbols-outlined">chat</span>
                    <span class="text-xs font-medium">Seguimiento</span>
                </a>
                <a class="flex flex-col items-center justify-center gap-1 text-gray-500 dark:text-gray-400" href="/pages/cliente/historial_cliente.html">
                    <span class="material-symbols-outlined">photo_library</span>
                    <span class="text-xs font-medium">Historial</span>
                </a>
            </div>
        </nav>
    </div>
<script>
    // Session check
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    const empresa = JSON.parse(localStorage.getItem('empresa') || 'null');

    if (!user) {
        window.location.href = '/';
    } else if (user.rol === 'cliente' && !empresa) {
        window.location.href = '/pages/empresas.html';
    } else {
        // Populate greeting
        function getIniciales(nombre = '') {
            const p = nombre.trim().split(/\s+/).filter(Boolean);
            if (p.length >= 2) return (p[0][0] + p[1][0]).toUpperCase();
            return (p[0] || '?').substring(0, 2).toUpperCase();
        }
        const greetEl = document.getElementById('user-greeting');
        if (greetEl) greetEl.textContent = `Hola, ${user.nombre}`;
        const initEl = document.getElementById('user-initials');
        if (initEl) initEl.textContent = getIniciales(user.nombre);

        // Populate empresa name
        const empEl = document.getElementById('empresa-name');
        if (empEl && empresa) empEl.textContent = empresa.nombre;
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
        localStorage.removeItem('user');
        localStorage.removeItem('empresa');
        window.location.href = '/';
    });

    // ===== PRÓXIMA CITA DINÁMICA =====
    (async function loadProximaCita() {
        if (!user) return;
        const container = document.getElementById('proxima-cita-container');
        if (!container) return;

        try {
            const res = await fetch(`/api/cotizaciones/cliente/${user.idcliente}`);
            const json = await res.json();
            if (json.status !== 'ok' || !json.data || json.data.length === 0) return;

            const cotizaciones = json.data;
            const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

            function fmtFecha(f) {
                if (!f) return '';
                const d = (f instanceof Date) ? f : new Date(typeof f === 'string' && !f.includes('T') ? f + 'T12:00:00' : f);
                if (isNaN(d.getTime())) return '';
                return `${d.getDate()} de ${meses[d.getMonth()]}, ${d.getFullYear()}`;
            }

            // Prioridad 1: pagada → cita confirmada (la más cercana en el futuro)
            const pagadas = cotizaciones.filter(c => (c.estado || '').toLowerCase() === 'pagada');
            if (pagadas.length > 0) {
                const cot = pagadas[0]; // ya ordenadas por fecha DESC, tomamos la más reciente
                container.innerHTML = `
                    <div class="relative overflow-hidden rounded-xl bg-gray-200/50 shadow-sm dark:bg-[#261933]">
                        <div class="absolute inset-0 bg-gradient-to-br from-primary/40 via-primary/20 to-transparent"></div>
                        <div class="relative flex flex-col justify-end p-5 text-white">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="material-symbols-outlined text-green-400">check_circle</span>
                                <p class="text-sm font-medium text-green-400">Cita Confirmada</p>
                            </div>
                            <p class="text-2xl font-bold leading-tight tracking-tight text-white">
                                Sesión con ${cot.tatuador_nombre || 'tu tatuador'}
                            </p>
                            <div class="mt-3 flex flex-col gap-2">
                                <div class="flex items-center gap-2">
                                    <span class="material-symbols-outlined text-lg text-white/80">calendar_today</span>
                                    <p class="text-base font-normal">${fmtFecha(cot.fecha)}</p>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="material-symbols-outlined text-lg text-white/80">schedule</span>
                                    <p class="text-base font-normal">${(cot.hora || '').substring(0, 5)} hrs</p>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="material-symbols-outlined text-lg text-white/80">payments</span>
                                    <p class="text-sm font-normal">Total: $${parseFloat(cot.preciofinal || cot.montoestimado || 0).toFixed(2)}</p>
                                </div>
                            </div>
                            <a onclick="localStorage.setItem('cotizacionSeleccionada','${cot.idcotizacion}');window.location.href='cotizacion/aceptar_cotizacion.html'"
                               class="mt-4 flex h-11 w-full cursor-pointer items-center justify-center rounded-lg bg-white px-4 text-base font-bold text-gray-900 shadow-md no-underline">
                                Ver Detalles
                            </a>
                        </div>
                    </div>
                `;
                container.classList.remove('hidden');
                return;
            }

            // Prioridad 2: aceptada → ya revisada, falta pagar
            const aceptadas = cotizaciones.filter(c => (c.estado || '').toLowerCase() === 'aceptada');
            if (aceptadas.length > 0) {
                const cot = aceptadas[0];
                const precio = parseFloat(cot.preciofinal || cot.montoestimado || 0);
                const deposito = Math.round(precio * 0.3 * 100) / 100;
                container.innerHTML = `
                    <div class="relative overflow-hidden rounded-xl border border-yellow-500/30 bg-gray-200/50 shadow-sm dark:bg-[#261933]">
                        <div class="absolute inset-0 bg-gradient-to-br from-yellow-500/20 via-transparent to-transparent"></div>
                        <div class="relative flex flex-col justify-end p-5 text-white">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="material-symbols-outlined text-yellow-400">info</span>
                                <p class="text-sm font-medium text-yellow-400">Cotización Aceptada — Pago pendiente</p>
                            </div>
                            <p class="text-xl font-bold leading-tight tracking-tight text-white">
                                Sesión con ${cot.tatuador_nombre || 'tu tatuador'}
                            </p>
                            <div class="mt-3 flex flex-col gap-2">
                                <div class="flex items-center gap-2">
                                    <span class="material-symbols-outlined text-lg text-white/80">calendar_today</span>
                                    <p class="text-base font-normal">${fmtFecha(cot.fecha)}</p>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="material-symbols-outlined text-lg text-white/80">schedule</span>
                                    <p class="text-base font-normal">${(cot.hora || '').substring(0, 5)} hrs</p>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="material-symbols-outlined text-lg text-white/80">payments</span>
                                    <p class="text-sm font-normal">Precio: $${precio.toFixed(2)} · Depósito: $${deposito.toFixed(2)}</p>
                                </div>
                            </div>
                            <p class="mt-3 text-xs text-white/60">Completa el pago del depósito para confirmar tu cita.</p>
                            <button onclick="localStorage.setItem('cotizacionSeleccionada','${cot.idcotizacion}');window.location.href='cotizacion/pagar_stripe_cotizacion.html'"
                               class="mt-3 flex h-11 w-full cursor-pointer items-center justify-center rounded-lg bg-primary px-4 text-base font-bold text-white shadow-md shadow-primary/40">
                                Pagar Depósito — $${deposito.toFixed(2)}
                            </button>
                        </div>
                    </div>
                `;
                container.classList.remove('hidden');
                return;
            }

            // Prioridad 3: revisada → el tatuador ya envió precio, cliente debe aceptar
            const revisadas = cotizaciones.filter(c => (c.estado || '').toLowerCase() === 'revisada');
            if (revisadas.length > 0) {
                const cot = revisadas[0];
                container.innerHTML = `
                    <div class="relative overflow-hidden rounded-xl border border-blue-500/30 bg-gray-200/50 shadow-sm dark:bg-[#261933]">
                        <div class="absolute inset-0 bg-gradient-to-br from-blue-500/20 via-transparent to-transparent"></div>
                        <div class="relative flex flex-col justify-end p-5 text-white">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="material-symbols-outlined text-blue-400">rate_review</span>
                                <p class="text-sm font-medium text-blue-400">Cotización Revisada</p>
                            </div>
                            <p class="text-xl font-bold leading-tight tracking-tight text-white">
                                Tu tatuador te ha enviado un precio
                            </p>
                            <p class="mt-2 text-sm text-white/70">
                                ${cot.tatuador_nombre || 'El tatuador'} ha revisado tu solicitud. Revisa y acepta la cotización para continuar.
                            </p>
                            <button onclick="localStorage.setItem('cotizacionSeleccionada','${cot.idcotizacion}');window.location.href='cotizacion/aceptar_cotizacion.html'"
                               class="mt-4 flex h-11 w-full cursor-pointer items-center justify-center rounded-lg bg-blue-600 px-4 text-base font-bold text-white shadow-md">
                                Ver Cotización
                            </button>
                        </div>
                    </div>
                `;
                container.classList.remove('hidden');
                return;
            }

            // Prioridad: pagado anticipo → cita confirmada (anticipo pagado, pendiente liquidación)
            const antiципo = cotizaciones.filter(c => (c.estado || '').toLowerCase() === 'pagado anticipo');
            if (antiципo.length > 0) {
                const cot = antiципo[0];
                const precio = parseFloat(cot.preciofinal || cot.montoestimado || 0);
                container.innerHTML = `
                    <div class="relative overflow-hidden rounded-xl border border-orange-500/30 bg-gray-200/50 shadow-sm dark:bg-[#261933]">
                        <div class="absolute inset-0 bg-gradient-to-br from-orange-500/15 via-transparent to-transparent"></div>
                        <div class="relative flex flex-col justify-end p-5 text-white">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="material-symbols-outlined text-orange-400">check_circle</span>
                                <p class="text-sm font-medium text-orange-400">Anticipo pagado — Cita confirmada</p>
                            </div>
                            <p class="text-xl font-bold leading-tight tracking-tight text-white">Sesión con ${cot.tatuador_nombre || 'tu tatuador'}</p>
                            <div class="mt-3 flex flex-col gap-1">
                                <div class="flex items-center gap-2">
                                    <span class="material-symbols-outlined text-lg text-white/80">calendar_today</span>
                                    <p class="text-base font-normal">${fmtFecha(cot.fecha)}</p>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="material-symbols-outlined text-lg text-white/80">schedule</span>
                                    <p class="text-base font-normal">${(cot.hora || '').substring(0, 5)} hrs</p>
                                </div>
                            </div>
                            <button onclick="localStorage.setItem('cotizacionSeleccionada','${cot.idcotizacion}');localStorage.setItem('tipoPago','liquidacion');window.location.href='cotizacion/pagar_stripe_cotizacion.html'"
                               class="mt-3 flex h-11 w-full cursor-pointer items-center justify-center rounded-lg bg-orange-500 px-4 text-base font-bold text-white shadow-md">
                                Pagar Liquidación — $${(precio * 0.5).toFixed(2)}
                            </button>
                        </div>
                    </div>`;
                container.classList.remove('hidden');
                return;
            }

            // Si solo hay pendientes/enviadas, no mostrar nada
        } catch (err) {
            console.error('Error cargando próxima cita:', err);
        }
    })();

    const mesesCortos = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    function fmtCorto(f) {
        if (!f) return '';
        const [y, m, d] = (f.substring ? f.substring(0,10) : f).split('-').map(Number);
        return `${d} ${mesesCortos[m-1]}`;
    }

    // ===== SCROLL HORIZONTAL: MIS TATUAJES =====
    (async function loadTatuajes() {
        if (!user || user.rol !== 'cliente') return;
        const el = document.getElementById('tatuajes-container');
        if (!el) return;
        const empty = `<div class="flex flex-col items-center justify-center rounded-xl border border-dashed border-gray-300 dark:border-gray-700 py-8 gap-2 mx-4"><span class="material-symbols-outlined text-4xl text-gray-400">photo_library</span><p class="text-sm text-gray-500 dark:text-gray-400">Tu historial aparecerá aquí una vez que pagues una cita</p></div>`;
        try {
            const res = await fetch(`/api/cotizaciones/cliente/${user.idcliente}`);
            const json = await res.json();
            const confirmadas = (json.data || []).filter(c => {
                const e = (c.estado || '').toLowerCase();
                return e === 'pagada' || e === 'pagado anticipo';
            });
            if (!confirmadas.length) { el.innerHTML = empty; return; }
            el.innerHTML = `
                <div class="flex gap-3 overflow-x-auto px-4 pb-2" style="-webkit-overflow-scrolling:touch;scrollbar-width:none;">
                    ${confirmadas.map(cot => {
                        const foto = cot.foto_final_url || cot.foto_referecncia_url;
                        const pagadoTotal = (cot.estado || '').toLowerCase() === 'pagada';
                        return `
                        <a href="/pages/cliente/historial_cliente.html" class="flex-shrink-0 w-28 flex flex-col gap-1.5">
                            <div class="w-28 h-28 rounded-xl overflow-hidden bg-gray-200 dark:bg-[#261933] relative">
                                ${foto ? `<img src="${foto}" alt="Tatuaje" class="w-full h-full object-cover" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
                                <div class="${foto ? 'hidden' : ''} absolute inset-0 flex items-center justify-center"><span class="material-symbols-outlined text-3xl text-gray-400">image</span></div>
                                <div class="absolute top-1.5 right-1.5"><span class="w-2 h-2 rounded-full block ${pagadoTotal ? 'bg-green-400' : 'bg-orange-400'}"></span></div>
                            </div>
                            <p class="text-xs font-semibold text-gray-800 dark:text-white truncate">${cot.estilo || 'Tatuaje'}</p>
                            <p class="text-xs text-gray-500 dark:text-gray-400">${fmtCorto(cot.fecha)}</p>
                        </a>`;
                    }).join('')}
                </div>`;
        } catch (_) { el.innerHTML = empty; }
    })();

    // ===== ACTIVIDAD RECIENTE =====
    (async function loadActividad() {
        if (!user || user.rol !== 'cliente') return;
        const el = document.getElementById('actividad-container');
        if (!el) return;

        const iconos = { 'pagada': 'check_circle', 'pagado anticipo': 'payments', 'aceptada': 'rate_review', 'enviada': 'receipt_long', 'pendiente': 'receipt_long', 'cancelada': 'cancel', 'rechazada': 'cancel' };
        const colores = { 'pagada': 'text-green-500', 'pagado anticipo': 'text-orange-400', 'aceptada': 'text-blue-400', 'enviada': 'text-yellow-400', 'pendiente': 'text-yellow-400', 'cancelada': 'text-red-400', 'rechazada': 'text-red-400' };
        const textos = { 'pagada': 'Cita confirmada y liquidada', 'pagado anticipo': 'Anticipo pagado — cita confirmada', 'aceptada': 'Cotización con precio final', 'enviada': 'Nueva cotización creada', 'pendiente': 'Cotización pendiente de revisión', 'cancelada': 'Cotización cancelada', 'rechazada': 'Cotización rechazada' };

        try {
            const res = await fetch(`/api/cotizaciones/cliente/${user.idcliente}`);
            const json = await res.json();
            if (json.status !== 'ok' || !json.data?.length) {
                el.innerHTML = `<div class="flex items-center justify-center py-4 text-gray-400"><p class="text-sm">Sin actividad reciente</p></div>`;
                return;
            }
            const recientes = json.data.slice(0, 3);
            el.innerHTML = recientes.map(cot => {
                const e = (cot.estado || '').toLowerCase();
                return `
                <div class="flex items-center gap-4 rounded-lg bg-gray-100 p-3 dark:bg-[#261933]/60">
                    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-primary/10 ${colores[e] || 'text-primary'}">
                        <span class="material-symbols-outlined text-xl">${iconos[e] || 'receipt_long'}</span>
                    </div>
                    <div class="flex flex-col min-w-0">
                        <p class="text-sm font-medium text-gray-800 dark:text-gray-200 truncate">${textos[e] || cot.estado}</p>
                        <p class="text-xs text-gray-500 dark:text-gray-400">Con ${cot.tatuador_nombre || '—'} · $${parseFloat(cot.preciofinal || cot.montoestimado || 0).toFixed(2)}</p>
                    </div>
                </div>`;
            }).join('');
        } catch (_) {
            el.innerHTML = `<div class="flex items-center justify-center py-4 text-gray-400"><p class="text-sm">Sin actividad reciente</p></div>`;
        }
    })();
</script>
<script type="module">
    import { initPush } from '/js/push.js';
