<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Reservar Cita - Hora</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        body { min-height: max(884px, 100dvh); }
    </style>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#7f13ec", "background-light": "#f7f6f8", "background-dark": "#191022" },
                    fontFamily: { "display": ["Space Grotesk", "sans-serif"] },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <link rel="stylesheet" href="../../styles/global.css" />
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
    <div class="relative flex h-auto min-h-screen w-full flex-col">
        <header class="flex items-center bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
            <button id="btn-back" class="text-white flex size-12 shrink-0 items-center justify-center">
                <span class="material-symbols-outlined text-2xl">arrow_back</span>
            </button>
            <h1 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Reservar Cita</h1>
            <div class="w-12"></div>
        </header>
        <main class="flex flex-col flex-1 px-4 pb-24">
            <h2 class="text-white tracking-tight text-[28px] font-bold leading-tight pt-5 pb-3">Elige tu Artista</h2>
            <!-- Artistas (dinámico) -->
            <div class="flex overflow-x-auto gap-4 pb-4 -mx-4 px-4" id="artistas-container">
                <div class="text-center py-8 w-full">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary border-t-transparent"></div>
                    <p class="text-gray-400 mt-2 text-sm">Cargando artistas...</p>
                </div>
            </div>

            <h2 class="text-white text-[22px] font-bold leading-tight tracking-[-0.015em] pt-8 pb-3">Selecciona Fecha</h2>
            <!-- Calendario -->
            <div class="flex flex-col gap-0.5 max-w-sm mx-auto w-full">
                <div class="flex items-center p-1 justify-between">
                    <button id="btn-prev-month" class="text-white flex size-10 items-center justify-center rounded-full hover:bg-white/10 transition-colors">
                        <span class="material-symbols-outlined text-lg">chevron_left</span>
                    </button>
                    <p id="calendar-title" class="text-white text-base font-bold leading-tight flex-1 text-center">...</p>
                    <button id="btn-next-month" class="text-white flex size-10 items-center justify-center rounded-full hover:bg-white/10 transition-colors">
                        <span class="material-symbols-outlined text-lg">chevron_right</span>
                    </button>
                </div>
                <div class="grid grid-cols-7 mb-1">
                    <p class="text-gray-400 text-xs font-bold flex h-10 items-center justify-center">L</p>
                    <p class="text-gray-400 text-xs font-bold flex h-10 items-center justify-center">M</p>
                    <p class="text-gray-400 text-xs font-bold flex h-10 items-center justify-center">X</p>
                    <p class="text-gray-400 text-xs font-bold flex h-10 items-center justify-center">J</p>
                    <p class="text-gray-400 text-xs font-bold flex h-10 items-center justify-center">V</p>
                    <p class="text-gray-400 text-xs font-bold flex h-10 items-center justify-center">S</p>
                    <p class="text-gray-400 text-xs font-bold flex h-10 items-center justify-center">D</p>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7">
                    <!-- Días se generan dinámicamente -->
                </div>
            </div>

            <h2 class="text-white text-[22px] font-bold leading-tight tracking-[-0.015em] pt-8 pb-3">Horarios Disponibles</h2>
            <div id="slots-container">
                <p class="text-gray-400 text-center py-4">Selecciona un artista y una fecha para ver horarios</p>
            </div>

            <div class="pt-8">
                <button id="btn-siguiente"
                    class="flex h-12 min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl bg-primary px-5 text-base font-bold tracking-wide text-white shadow-lg shadow-primary/40">
                    <span class="truncate">Siguiente: Ver Resumen</span>
                </button>
            </div>
        </main>
    </div>
    <script src="/js/agendar_cita.js"></script>
</body>
</html>
