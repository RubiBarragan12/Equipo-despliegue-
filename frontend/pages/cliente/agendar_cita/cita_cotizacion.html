<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Resumen de Cita</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        body { min-height: max(884px, 100dvh); }
    </style>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#7f13ec", "background-light": "#f7f6f8", "background-dark": "#191022" },
                    fontFamily: { "display": ["Space Grotesk", "sans-serif"] },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <link rel="stylesheet" href="../styles/global.css" />
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
    <div class="relative flex h-auto min-h-screen w-full flex-col">
        <header class="flex items-center bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10 border-b border-white/10">
            <button id="btn-back" class="text-white flex size-12 shrink-0 items-center justify-start">
                <span class="material-symbols-outlined text-2xl">arrow_back</span>
            </button>
            <h1 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Resumen de tu Cita</h1>
            <div class="flex size-12 shrink-0 items-center"></div>
        </header>
        <main class="flex-1 pb-40">
            <section class="p-4">
                <h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] pb-3">Detalles del Tatuaje</h2>
                <div class="rounded-xl overflow-hidden bg-black/20 ring-1 ring-inset ring-white/10">
                    <div id="resumen-imagen" class="w-full bg-center bg-no-repeat aspect-video bg-cover bg-gray-800 flex items-center justify-center">
                        <span class="material-symbols-outlined text-4xl text-gray-600">image</span>
                    </div>
                    <div class="flex w-full flex-col gap-2 p-4">
                        <p id="resumen-descripcion" class="text-white text-lg font-bold leading-tight tracking-[-0.015em]">...</p>
                        <p id="resumen-detalles" class="text-[#ad92c9] text-base font-normal leading-normal">...</p>
                    </div>
                </div>
            </section>
            <div class="px-4"><hr class="border-white/10" /></div>
            <section class="p-4">
                <div class="flex flex-col gap-0.5">
                    <div class="flex items-center gap-4 py-2 justify-between">
                        <div class="flex items-center gap-4">
                            <div class="text-white flex items-center justify-center rounded-lg bg-[#362348] shrink-0 size-10">
                                <span class="material-symbols-outlined text-xl">person</span>
                            </div>
                            <p class="text-[#ad92c9] text-base font-normal leading-normal flex-1 truncate">Artista</p>
                        </div>
                        <div class="shrink-0">
                            <p id="resumen-artista" class="text-white text-base font-medium leading-normal">...</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 py-2 justify-between">
                        <div class="flex items-center gap-4">
                            <div class="text-white flex items-center justify-center rounded-lg bg-[#362348] shrink-0 size-10">
                                <span class="material-symbols-outlined text-xl">calendar_month</span>
                            </div>
                            <p class="text-[#ad92c9] text-base font-normal leading-normal">Fecha</p>
                        </div>
                        <div class="shrink-0 text-right">
                            <p id="resumen-fecha" class="text-white text-base font-medium leading-normal">...</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 py-2 justify-between">
                        <div class="flex items-center gap-4">
                            <div class="text-white flex items-center justify-center rounded-lg bg-[#362348] shrink-0 size-10">
                                <span class="material-symbols-outlined text-xl">schedule</span>
                            </div>
                            <p class="text-[#ad92c9] text-base font-normal leading-normal">Hora</p>
                        </div>
                        <div class="shrink-0">
                            <p id="resumen-hora" class="text-white text-base font-medium leading-normal">...</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer class="fixed bottom-0 left-0 right-0 p-4 bg-background-dark/80 backdrop-blur-sm border-t border-white/10">
            <div class="flex flex-col gap-3 max-w-md mx-auto">
                <button id="btn-solicitar"
                    class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-4 bg-primary text-white text-base font-bold leading-normal shadow-lg shadow-primary/40">
                    <span class="truncate">Solicitar Cotización</span>
                </button>
                <button id="btn-cancelar"
                    class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-4 bg-transparent text-primary text-base font-bold leading-normal hover:bg-primary/5 transition-colors">
                    <span class="truncate">Cancelar</span>
                </button>
            </div>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/agendar_cita.js"></script>
</body>
</html>
