<!DOCTYPE html>
<html class="dark" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Iniciar Sesión - Tattoo Studio</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="/css/index.css" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7f13ec",
                        "background-light": "#f7f6f8",
                        "background-dark": "#191022",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>

<body class="bg-background-light dark:bg-background-dark font-display">
    <div class="relative flex min-h-screen w-full flex-col items-center justify-center overflow-x-hidden p-4">
        <div class="absolute inset-0 z-0">
            <div class="absolute inset-0 bg-background-light dark:bg-background-dark opacity-80"></div>
            <div class="w-full h-full bg-center bg-no-repeat bg-cover"
                data-alt="Abstract artistic background with tattoo-inspired ink patterns"
                style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAPbI01y_tzm0DFB6atlQkwbbmqtkQe2TAGkFummcC5tSAV0t83nhoiTzs5CXsNGl3DWX3UHl9gIsoLpG-quPG2vWK0W4B-yF1FJhpIAxa3njYXR3w-PMcm0e2p3eSRIxkjoOUyeSWboZFHeet77s041788nWfJDlks1oZQMa4zkN6c8jMBkFCHGoop0toyqCeVWfHiA-A5h4dkre6ZKUYpNilGsvsaWT18LT99gG0gNFLOapcVM1G9GfMtV4MvsgloZiX7PoebG60"); opacity: 0.1;'>
            </div>
        </div>
        <div id="loginForm" class="relative z-10 flex w-full max-w-sm flex-col items-center">
            <div class="mb-8 flex h-24 w-24 items-center justify-center rounded-full bg-primary/20">
                <span class="material-symbols-outlined text-primary text-5xl">draw</span>
            </div>
            <h1 class="text-3xl font-bold leading-tight tracking-tight text-slate-900 dark:text-white text-center pb-8">
                Bienvenido de Nuevo
            </h1>
            <div class="w-full space-y-6">
                <div class="w-full">
                    <label class="flex flex-col">
                        <p class="text-sm font-medium pb-2 text-slate-700 dark:text-white">Correo Electrónico</p>
                        <div class="relative flex w-full flex-1 items-stretch">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 pointer-events-none">person</span>
                            <input
                                id="email"
                                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900/50 text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500 pl-12 pr-4 text-base font-normal leading-normal"
                                placeholder="tu@email.com" value="" />
                        </div>
                    </label>
                </div>
                <div class="w-full">
                    <label class="flex flex-col">
                        <p class="text-sm font-medium pb-2 text-slate-700 dark:text-white">Contraseña</p>
                        <div class="relative flex w-full flex-1 items-stretch">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 pointer-events-none">lock</span>
                            <input
                                id="password"
                                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900/50 text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500 pl-12 pr-12 text-base font-normal leading-normal"
                                placeholder="Introduce tu contraseña" type="password" value="" />
                            <button id="togglePassword"
                                class="absolute right-0 top-0 h-full px-4 text-slate-400 flex items-center justify-center dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300"
                                data-icon="Eye" data-size="24px" data-weight="regular">
                                <span class="material-symbols-outlined">visibility_off</span>
                            </button>
                        </div>
                    </label>
                </div>
            </div>
            <button
                id="login-btn"
                class="flex w-full items-center justify-center rounded-lg bg-primary h-14 px-6 text-base font-bold text-white shadow-sm hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 dark:focus:ring-offset-background-dark transition-colors duration-200 mt-8">
                Iniciar Sesión
            </button>
            <div class="flex flex-col items-center mt-6 space-y-4 w-full">
                <a  id="recuperar-password-btn" class="text-primary text-sm font-medium leading-normal underline hover:no-underline cursor-pointer"
                    href="/pages/recuperacion-contra/restablecer_contrasena.html">
                    ¿Olvidaste tu contraseña?
                </a>
                <a  id="registrarse-btn" class="text-primary text-sm font-medium leading-normal underline hover:no-underline cursor-pointer"
                    href="/pages/registrar_cuenta.html">
                    Registrarse
                </a>
            </div>
        </div>
    </div>
</body>
<script type="module" src="/js/index.js"></script>
</html>
